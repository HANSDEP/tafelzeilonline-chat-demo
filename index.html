<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>TafelzeilOnline - Zendesk chat (demo)</title>
  <script>
    // ?nieuw=1: wis de widgetsessie vóór de widget laadt, zodat er een vers gesprek start
    if (new URLSearchParams(location.search).has('nieuw')) {
      try {
        sessionStorage.clear(); localStorage.clear();
        document.cookie.split(';').forEach(function (c) {
          var n = c.split('=')[0].trim();
          if (n) document.cookie = n + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/';
        });
      } catch (e) {}
      history.replaceState(null, '', location.pathname);
    }
  </script>
  <script id="ze-snippet" src="https://static.zdassets.com/ekr/snippet.js?key=270edec0-1711-4e16-85ca-7caf5529f0ef"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #fafafa; }
    .site { display: block; width: 100%; max-width: 1440px; margin: 0 auto; height: auto; user-select: none; -webkit-user-drag: none; }
    .demo { position: fixed; left: 16px; bottom: 16px; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px;
      max-width: calc(100vw - 120px); padding: 8px 14px; border-radius: 999px; background: rgba(40, 35, 89, .92); color: #fff;
      font: 13px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; box-shadow: 0 6px 24px rgba(0,0,0,.18); }
    .demo strong { font-weight: 600; letter-spacing: .02em; }
    .demo a, .demo button { color: #fff; opacity: .85; text-decoration: none; background: none; border: 0; padding: 0; font: inherit; cursor: pointer; }
    .demo a:hover, .demo button:hover { opacity: 1; text-decoration: underline; }
    .demo .sep { opacity: .4; }
  </style>
</head>
<body>
  <img class="site" src="homepage.jpg" alt="TafelzeilOnline homepage (demo-achtergrond)" />
  <div class="demo" role="navigation" aria-label="Demo">
    <strong>Demo</strong><span class="sep">·</span>
    <a href="trengo.html">Trengo-chat</a><span class="sep">·</span>
    <button id="reset" type="button">Nieuw gesprek</button><span class="sep">·</span>
    <a href="meetlint-199cm.png" download>Foto meetlint</a><span class="sep">·</span>
    <a href="logo-klant.png" download>Logo</a>
  </div>
  <script>
    document.getElementById('reset').addEventListener('click', function () {
      try { zE('messenger', 'close'); } catch (e) {}
      setTimeout(function () {
        try { sessionStorage.clear(); localStorage.clear(); } catch (e) {}
        location.href = location.pathname + '?nieuw=1';
      }, 400);
    });
  </script>
</body>
</html>
